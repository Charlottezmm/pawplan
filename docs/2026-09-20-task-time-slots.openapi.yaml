openapi: 3.1.0
info:
  title: PawPlan Task Time Slots
  version: 1.0.0
  description: All dates and clocks use Asia/Shanghai. Review, user approval, Apply and persisted readback are distinct steps.
paths:
  /api/task-timing:
    get:
      summary: Read active-plan task timing and fixed occurrences
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: 'tasks, fixed, date, dateTo; maximum date span 31 days' }
        '401': { description: Workspace session required }
        '400': { description: Invalid date range }
    post:
      summary: Create an idempotent Review without changing tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request, idempotencyKey]
              properties:
                idempotencyKey: { type: string, minLength: 1, maxLength: 180 }
                request: { $ref: '#/components/schemas/TimingRequest' }
      responses:
        '200': { description: 'approvalId (null for no changes), changes with taskId/title/before/after, warnings, liveUnchanged=true' }
        '400': { description: Invalid fields or idempotency key reused with different payload }
        '401': { description: Workspace session required }
        '409': { description: Conflict, protected time, invalid deadline or no feasible extension }
    patch:
      summary: Atomically apply a user-approved preview and read back exact IDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approvalId]
              properties:
                approvalId: { type: string, format: uuid }
      responses:
        '200': { description: 'status=applied, approvalId, replayed, verified=true, readback tasks' }
        '401': { description: Workspace session required }
        '404': { description: Preview not found in this workspace }
        '409': { description: Not approved, expired, stale, or post-commit state subsequently changed }
        '500': { description: Transaction failed; do not report task completion }
  /api/operation-approvals:
    post:
      summary: Existing browser-only user approval decision
      description: MCP has no approval capability. This endpoint authorizes the exact preview; call Apply afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalId, decision]
              properties:
                approvalId: { type: string, format: uuid }
                decision: { enum: [approved, rejected] }
      responses:
        '200': { description: Exact approval decision persisted }
        '401': { description: Workspace session required }
        '409': { description: Expired or already decided }
components:
  schemas:
    TimingRequest:
      oneOf:
        - type: object
          required: [action, edits]
          properties:
            action: { const: schedule }
            edits:
              type: array
              minItems: 1
              maxItems: 60
              items:
                type: object
                required: [taskId, date, startTime, minutes, locked, deadlineAt, targetDate]
                properties:
                  taskId: { type: string, format: uuid }
                  date: { type: string, format: date }
                  startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
                  minutes: { type: integer, minimum: 5, maximum: 480 }
                  locked: { type: boolean }
                  deadlineAt: { type: [string, 'null'], format: date-time }
                  targetDate: { type: [string, 'null'], format: date }
                  checkpoint: { type: string, maxLength: 2000 }
        - allOf:
            - { $ref: '#/components/schemas/SearchWindow' }
            - type: object
              required: [action, taskIds]
              properties:
                action: { const: arrange }
                taskIds: { type: array, minItems: 1, maxItems: 60, items: { type: string, format: uuid } }
        - allOf:
            - { $ref: '#/components/schemas/SearchWindow' }
            - type: object
              required: [action, taskId, minutes, checkpoint]
              properties:
                action: { const: defer }
                taskId: { type: string, format: uuid }
                minutes: { type: integer, minimum: 5, maximum: 480 }
                checkpoint: { type: string, minLength: 1, maxLength: 2000 }
        - type: object
          required: [action, taskId, minutes]
          properties:
            action: { const: extend }
            taskId: { type: string, format: uuid }
            minutes: { type: integer, minimum: 5, maximum: 120 }
            endTime: { type: string, default: '22:00' }
        - type: object
          required: [action, taskId, checkpoint]
          properties:
            action: { const: pause }
            taskId: { type: string, format: uuid }
            checkpoint: { type: string, minLength: 1, maxLength: 2000 }
        - type: object
          required: [action, taskId]
          properties:
            action: { const: complete }
            taskId: { type: string, format: uuid }
            checkpoint: { type: string, maxLength: 2000 }
    SearchWindow:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        dateTo: { type: string, format: date }
        startTime: { type: string, default: '08:00' }
        endTime: { type: string, default: '22:00' }
        gapMinutes: { type: integer, default: 10, minimum: 0, maximum: 60 }
